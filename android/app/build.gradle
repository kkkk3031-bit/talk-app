plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khaled.talkapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.khaled.talkapp"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
