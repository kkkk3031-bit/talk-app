<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>talk-app</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1>talk-app</h1>
      <p>Pick a display name to join.</p>
      <input id="username-input" dir="auto" placeholder="Display name" maxlength="24" autofocus />
      <button id="join-btn">Join</button>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>
    <nav id="server-rail">
      <div id="server-rail-list"></div>
      <div id="server-add-btn" class="server-icon server-add" title="Add or create a server">+</div>
    </nav>
    <aside class="sidebar">
      <div id="friends-nav" class="nav-item">👥 Friends</div>
      <div class="section-title">Text Channels</div>
      <ul id="channel-list"></ul>
      <div class="section-title">Voice</div>
      <div id="voice-controls">
        <div id="voice-room-nav" class="nav-item active">🔊 Voice Room</div>
        <button id="voice-toggle-btn">Join Voice</button>
        <div id="voice-media-controls" class="hidden">
          <button id="camera-toggle-btn" class="icon-btn" title="Turn on camera">📷</button>
        </div>
      </div>
      <div class="section-title">Online</div>
      <ul id="presence-list"></ul>
      <div class="sidebar-spacer"></div>
      <div id="user-bar">
        <div id="user-bar-avatar" class="avatar"></div>
        <div id="user-bar-name"></div>
        <button id="mute-mic-btn" class="icon-btn" title="Mute microphone" disabled>🎤</button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </aside>
    <div id="sidebar-resize-handle" class="sidebar-resize-handle"></div>
    <main class="main">
      <header class="channel-header">
        <button id="sidebar-toggle-btn" class="icon-btn sidebar-toggle" title="Channels">☰</button>
        <span id="main-header-text">🔊 Voice Room</span>
      </header>
      <div id="voice-view">
        <div id="video-grid" class="video-grid hidden"></div>
        <div id="voice-empty-state" class="voice-empty-state">
          <p>Nobody's here yet.</p>
          <button id="voice-empty-join-btn">Join Voice</button>
        </div>
      </div>
      <div id="text-view" class="hidden">
        <div id="messages" class="messages"></div>
        <div id="typing-indicator" class="typing-indicator"></div>
        <div id="attachment-preview" class="attachment-preview hidden"></div>
        <form id="message-form" class="message-form">
          <button type="button" id="attach-btn" class="icon-btn" title="Attach file or image">📎</button>
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,application/zip,application/msword" hidden />
          <input id="message-input" dir="auto" placeholder="Message #general" autocomplete="off" />
          <button type="submit" class="send-btn" title="Send">➤</button>
        </form>
      </div>
      <div id="friends-view" class="hidden">
        <div class="friends-section">
          <form id="add-friend-form" class="add-friend-form">
            <input id="add-friend-input" dir="auto" placeholder="Add a friend by username" autocomplete="off" />
            <button type="submit">Send Request</button>
          </form>
        </div>
        <div class="friends-section">
          <div class="friends-heading">Pending Requests</div>
          <ul id="incoming-requests-list" class="friends-list"></ul>
        </div>
        <div class="friends-section">
          <div class="friends-heading">Friends</div>
          <ul id="friends-list" class="friends-list"></ul>
        </div>
      </div>
      <div id="dm-view" class="hidden">
        <div id="dm-messages" class="messages"></div>
        <div id="dm-typing-indicator" class="typing-indicator"></div>
        <form id="dm-form" class="message-form">
          <input id="dm-input" dir="auto" placeholder="Message" autocomplete="off" />
          <button type="submit" class="send-btn" title="Send">➤</button>
        </form>
      </div>
    </main>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Settings</h2>
      <label class="modal-label" for="display-name-input">Display name</label>
      <div class="modal-row">
        <input id="display-name-input" dir="auto" maxlength="24" />
        <button id="save-name-btn">Save</button>
      </div>
      <div id="rename-error" class="modal-error hidden"></div>
      <label class="modal-label">Avatar</label>
      <div class="modal-row avatar-row">
        <div id="avatar-preview" class="avatar avatar-preview"></div>
        <button id="avatar-upload-btn" type="button">Upload photo</button>
        <input id="avatar-file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
      </div>
      <label class="modal-label" for="mic-select">Input device (microphone)</label>
      <select id="mic-select"></select>
      <label class="modal-label" for="volume-slider">Output volume — <span id="volume-value">100</span>%</label>
      <input id="volume-slider" type="range" min="0" max="100" value="100" />
      <div class="modal-actions">
        <button id="settings-close-btn">Done</button>
      </div>
    </div>
  </div>

  <div id="server-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Servers</h2>
      <label class="modal-label" for="create-server-input">Create a new server</label>
      <div class="modal-row">
        <input id="create-server-input" dir="auto" placeholder="Server name" maxlength="40" />
        <button id="create-server-btn">Create</button>
      </div>
      <label class="modal-label">Invite link for current server</label>
      <div class="modal-row">
        <input id="invite-link-input" readonly />
        <button id="copy-invite-btn">Copy</button>
      </div>
      <label class="modal-label">Members of current server</label>
      <ul id="server-members-list" class="friends-list"></ul>
      <label class="modal-label">Browse &amp; join</label>
      <ul id="browse-server-list" class="friends-list"></ul>
      <div class="modal-actions">
        <button id="server-modal-close-btn">Done</button>
      </div>
    </div>
  </div>

  <div id="image-lightbox" class="image-lightbox hidden">
    <img id="lightbox-img" src="" alt="" />
  </div>

  <audio id="remote-audios"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
